name: Pipeline CI/CD

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: webapp:${{ github.sha }}

      - name: Detect secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-dev:
    name: Deploy -> dev
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Deploy (simulado)
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          DESTINO="${BUCKET:-bucket-no-configurado}"
          echo "Ambiente: dev"
          echo "Destino: s3://$DESTINO"
          echo "Commit: ${{ github.sha }}"
          echo "### Deploy a dev" >> $GITHUB_STEP_SUMMARY
          echo "- Destino: \`s3://$DESTINO\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Modo: simulado (sin credenciales de AWS)" >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    name: Deploy -> staging
    needs: build-and-test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy (simulado)
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          DESTINO="${BUCKET:-bucket-no-configurado}"
          echo "Ambiente: staging"
          echo "Destino: s3://$DESTINO"
          echo "### Deploy a staging" >> $GITHUB_STEP_SUMMARY
          echo "- Destino: \`s3://$DESTINO\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy -> production
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy (simulado)
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          DESTINO="${BUCKET:-bucket-no-configurado}"
          echo "Ambiente: production"
          echo "Destino: s3://$DESTINO"
          echo "### Deploy a production" >> $GITHUB_STEP_SUMMARY
          echo "- Destino: \`s3://$DESTINO\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Aprobado manualmente antes de ejecutarse" >> $GITHUB_STEP_SUMMARY
